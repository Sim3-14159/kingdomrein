<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom REIN - Renters to Homeowners</title>
    <link rel="icon" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --sand: #F5F1EB;
            --clay: #B5895F;
            --olive: #3E4B2C;
            --charcoal: #2C2C2C;
            --cream: #FFFCF8;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--sand);
            color: var(--charcoal);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        header {
            padding: 2rem 0;
            border-bottom: 3px solid var(--clay);
        }
        
        .hero {
            padding: 5rem 0;
            text-align: center;
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: -2px;
            color: var(--olive);
        }
        
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        
        .cta-section {
            padding: 3rem 0;
            background: var(--olive);
            color: var(--cream);
            text-align: center;
        }
        
        .cta-button {
            display: inline-block;
            padding: 1rem 3rem;
            background: var(--clay);
            color: var(--cream);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            border: 3px solid var(--clay);
        }
        
        .cta-button:hover {
            background: transparent;
            color: var(--clay);
        }
        
        .features {
            padding: 4rem 0;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .feature-card {
            padding: 2rem;
            border: 2px solid var(--clay);
            background: var(--cream);
            text-align: center;
        }
        
        .feature-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--olive);
        }
        
        footer {
            padding: 2rem 0;
            text-align: center;
            border-top: 1px solid var(--clay);
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
        }
                
        a[href^="mailto:"] {
            color: var(--clay); font-weight: bold;
            transition: 0.2s ease;
            border-radius: 5px;
            padding: 2px;
            text-decoration: none;
        }

        a[href^="mailto:"]:hover {
            text-decoration: underline;
        }

        .flex-container {
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
        }
    </style>
</head>
<body>

    <!-- Added messaging section -->
    <section style="text-align: center; padding: 2rem;">
        <p style="font-size: 1.2rem;">
            Thank you for your purchase!
        </p>
    </section>

    <button class="flex-container">
        <a download class="cta-button" href="abcdefghijklmnopqrstuvwxyz/RENTERS 2 SELLERS A PATHWAY TO HOMEOWNERSHIP.pdf">Download Our Guide</a>
    </button>
    <footer>
        <div class="container">
            <p>&copy; 2025 Kingdom REIN. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
